spring:
  datasource:
    url: jdbc:h2:mem:identity;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
    table: flyway_history_identity
  h2:
    console:
      enabled: false

rrhh:
  tenant-resolver:
    delay-ms: 0
